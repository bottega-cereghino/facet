name: CodeQL

# Static analysis of the Go code, on every pull request and on main. CodeQL is
# free on a public repository. The job uploads its results; the verdict is the
# separate "CodeQL" check that code scanning adds to the pull request (new
# alerts of error severity, or of high security severity and above, fail it).
# It is not a required check. See AGENTS.md, section CI.
#
# No schedule: the repository has no traffic between pull requests, and main
# is analysed on every merge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          check-latest: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
