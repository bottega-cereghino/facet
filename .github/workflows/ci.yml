name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite makes real git commits (reap-blocker tests); a fresh runner has no
  # git identity, so supply one for all platforms.
  GIT_AUTHOR_NAME: facet CI
  GIT_AUTHOR_EMAIL: ci@facet.invalid
  GIT_COMMITTER_NAME: facet CI
  GIT_COMMITTER_EMAIL: ci@facet.invalid
  # shellcheck, the one linter that is no `go run` pin (see the Makefile): an
  # exact release and the SHA-256 of its Linux x64 tarball, the release page's
  # asset digest. Renovate moves the version and cannot move the checksum, so
  # its pull request stays red until someone updates both.
  # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  # shfmt, the same way: an exact release and the SHA-256 of its Linux amd64
  # binary, the release page's asset digest.
  # renovate: datasource=github-releases depName=mvdan/sh extractVersion=^v(?<version>.+)$
  SHFMT_VERSION: 3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf

# Third-party actions are pinned to full-length commit SHAs, per GitHub's
# hardening guidance. A tag is mutable: `@v4` is a promise the upstream owner
# can rewrite at any time, and it runs with a checkout of this repository. The
# trailing comment is the human-readable version; the SHA is what actually runs.
# Bump both together.
#
# The linter and govulncheck are no longer actions at all. They are `go run`
# pins in the Makefile, so `make lint` on a laptop and `make lint` here are the
# same version by construction rather than by two files agreeing -- which they
# had stopped doing: the workflow pinned a linter release several versions
# behind, and govulncheck ran as `@latest`, which is not a pin.
jobs:
  # Tier 1 -- Linux, the cheap gate. Runs every check, on every push and every
  # pull request including drafts. This leg should catch essentially all
  # breakage.
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The major.minor series, not go.mod's exact `go 1.25.0`, plus
          # check-latest: setup-go would otherwise install exactly 1.25.0, and
          # govulncheck rightly fails a toolchain with known stdlib
          # vulnerabilities. CI should build with the newest patch of the series
          # the module targets.
          go-version: '1.25'
          check-latest: true

      # One step per gate: `make check` locally, split here so a red run names
      # the gate in the UI instead of collapsing to "make failed". The commands
      # and the tool versions live only in the Makefile, so CI and a developer
      # machine cannot disagree about what passing means.
      - run: make build
      - run: make fmt
      - run: make vet
      - run: make lint
      - name: Install shellcheck
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.gz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.gz" | sha256sum --check --strict
          tar -xzf shellcheck.tar.gz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - run: make shellcheck SHELLCHECK="$RUNNER_TEMP/shellcheck"
      - name: Install shfmt
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum --check --strict
          chmod +x shfmt
      - run: make shfmt SHFMT="$RUNNER_TEMP/shfmt"
      # The organisation-name guard (internal/privacy) must not carry an
      # employer's internal names in this public repo, so its word list is a
      # secret (Settings -> Secrets and variables -> Actions, comma-separated)
      # rather than committed. With it set, the guard runs; unset, the guard
      # fails in CI (CI=true) rather than passing green having checked nothing.
      #
      # The secret reaches this one step and macos's test step: the guard is a
      # Go test, so only `make test` needs it, and no other step or action is
      # handed it.
      - run: make test
        env:
          FACET_DENYLIST: ${{ secrets.FACET_DENYLIST }}
      - run: make tidy
      - run: make vuln

  # Tier 2 -- macOS, the platform facet is built for, deliberately gated behind
  # Linux and deliberately narrower.
  #
  #   * `needs: linux` -- there is no point paying a second runner to learn
  #     what the first one already knows. A gofmt slip or a lint finding fails
  #     in well under a minute instead of after both platform runs finish in
  #     parallel. Note this is NOT a billing argument: facet is a public
  #     repository, so GitHub-hosted runners are free on every OS. It is about
  #     how fast a red tells you something.
  #
  #   * skipped on draft pull requests, and on pull requests not targeting
  #     `main` -- work in progress still gets the full Linux leg, and marking a
  #     PR ready for review triggers these.
  #
  #   * build and test only -- gofmt, lint and govulncheck are
  #     platform-independent by construction, so running them twice buys
  #     nothing. What this leg uniquely proves is that the code compiles and
  #     its tests pass on APFS and the darwin-only code (internal/workspace's
  #     private_darwin.go).
  #
  # The cost is serialized feedback -- a macOS-only failure surfaces one job
  # later. That is the right trade while such failures are rare. What a red
  # macos means for what may be merged is the platform policy in docs/CODE.md.
  #
  # Never add a tolerance construct (continue-on-error, if: always(), || true)
  # to any job here. The tiering is about when a check runs, never about whether
  # its result is believed. The one `if: always()` is on `ci` below, and it makes
  # a failure count rather than hiding one: without it `ci` would be skipped when
  # linux fails, and a skipped job reads as passed.
  macos:
    name: macos
    needs: linux
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25' # newest patch of the series; see the linux job
          check-latest: true
      - run: make build
      - run: make test # the word list, as in the linux job
        env:
          FACET_DENYLIST: ${{ secrets.FACET_DENYLIST }}

  # renovate.json must pass Renovate's own validator. The image is the Renovate
  # release that holds it, pinned by tag and digest; Renovate moves it like any
  # other dependency. It comes from Docker Hub, not GHCR: the same image and
  # digest, but GHCR gives no release dates, and without one the 14 day rule
  # holds an update back forever.
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: renovate/renovate:44.155.1@sha256:f5796f26088c0f5debb07c16fa9e801145e4d3ba9717d9cc22ca8cd265e2a0eb
      # The checkout writes into the runner workspace, which the image user
      # cannot write.
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: renovate-config-validator --strict

  # The one result. It runs even when a job above fails or is skipped, so one
  # name says whether a pull request is green. A skipped job passes here: macos
  # skips on drafts on purpose, and the ruleset still requires macos by name.
  # Add every new job to `needs`.
  ci:
    name: ci
    if: always()
    needs: [linux, macos, renovate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "A job failed or was cancelled: $NEEDS"
          exit 1
      - run: echo "Every job passed or was skipped."
